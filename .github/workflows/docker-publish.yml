name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: "44 2 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pitchpredictionswebsite

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out pitchpredk3ssetup
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/pitchpredk3ssetup
          path: pitchpredk3ssetup
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update values.yaml and push to pitchpredk3ssetup
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA_PART="${{ steps.meta.outputs.tags }}"
          SHORT_SHA_PART="$(echo "$SHORT_SHA_PART" | awk -F':' '{print $2}' | cut -c1-11)"
          cd pitchpredk3ssetup

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          DEFAULT_BRANCH="$(git remote show origin | awk '/HEAD branch/ {print $NF}')"

          # Remote master often moves between runs; retry from latest tip each time.
          for attempt in 1 2 3 4 5; do
            git checkout "$DEFAULT_BRANCH"
            git fetch origin
            git reset --hard "origin/$DEFAULT_BRANCH"

            sed -i "s|tag:.*|tag: $SHORT_SHA_PART|" pitchpredictionswebsite/values.yaml
            echo "Updated tag in values.yaml to $SHORT_SHA_PART (attempt $attempt)"

            git add pitchpredictionswebsite/values.yaml
            if git diff --staged --quiet; then
              echo "Tag already up to date"
              exit 0
            fi

            git commit -m "Update Docker image tag to $SHORT_SHA_PART"

            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Pushed image tag update on attempt $attempt"
              exit 0
            fi

            echo "Push rejected (attempt $attempt). Retrying from latest remote..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after retries"
          exit 1
